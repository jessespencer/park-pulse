<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Park Pulse</title>
    <meta name="description" content="Beat the crowds: monthly visits across America's national parks, 1979 to present." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="./" id="brand"><span id="brand-mark"></span><span class="brand-text"><span class="brand-name">Park Pulse</span><span class="brand-tag">Est. 1979 · Visits by month</span></span></a>
        <nav id="nav" aria-label="Views"></nav>
        <div class="header-tools">
          <label class="search">
            <span class="visually-hidden">Search parks</span>
            <input id="search" type="search" list="park-list" placeholder="Find a park…" autocomplete="off" />
          </label>
          <button id="theme" type="button" class="theme-btn"></button>
        </div>
      </div>
    </header>
    <div id="stripes"></div>
    <datalist id="park-list"></datalist>
    <div id="banner" hidden></div>
    <main id="app" aria-live="polite"></main>
    <footer id="footer"></footer>
    <div id="tooltip" role="status" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
