<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Park Pulse</title>
    <meta name="description" content="When each U.S. national park is busiest: monthly visits since 1979, and the parks at their least busy in any month." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="./" id="brand"><span id="brand-mark"></span><span class="brand-name">Park Pulse</span></a>
        <div id="dock" class="dock"></div>
        <div class="header-tools">
          <button id="theme" type="button" class="theme-btn"></button>
          <div class="menu">
            <button id="menu-btn" type="button" class="menu-btn" aria-haspopup="true" aria-expanded="false" aria-controls="nav">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
              <span id="menu-label">Menu</span>
            </button>
            <nav id="nav" class="menu-pop" aria-label="Views" hidden></nav>
          </div>
        </div>
      </div>
    </header>
    <div id="banner" hidden></div>
    <main id="app" aria-live="polite"></main>
    <footer id="footer"></footer>
    <div id="tooltip" role="status" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
